name: App

on:
  push:
    branches: [main, arcium-migration]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"

jobs:
  build:
    name: lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Non-blocking: the codebase carries pre-existing lint debt (~56 errors,
      # mostly react-hooks/exhaustive-deps and no-explicit-any). Surfaced here
      # for visibility; flip to blocking once the debt is paid down.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
