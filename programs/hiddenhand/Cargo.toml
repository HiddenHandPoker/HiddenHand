[package]
name = "hiddenhand"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hiddenhand"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
# Migrated to Anchor 1.0 / Solana 3.x generation (Phase 2, 2026-07-01).
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.2", features = ["token", "associated_token"] }

# Manual CPI to Inco Lightning (src/inco_cpi.rs) — no Anchor dep, but audited for
# Solana v3 (unsafe sol_mem* ops, AccountInfo::new). Retired in Phase 3 (-> Arcium).

# MagicBlock VRF SDK — 0.4.1 is the live release on the Anchor 1.0 / Solana 3.0 line.
ephemeral-vrf-sdk = { version = "0.4.1", features = ["anchor"] }
constant_time_eq = "=0.3.1"

# SHA256 hashing for Ed25519 message verification
sha2 = "0.10"

# Instructions sysvar helpers (load_instruction_at_checked, ID) — moved out of
# solana-program into this crate in the Solana 3.x split.
solana-instructions-sysvar = "3"

# MagicBlock Session Keys — 3.1.1 accepts anchor-lang >=0.28,<2.0 (incl. 1.0).
session-keys = { version = "3.1.1", features = ["no-entrypoint"] }

# Note: LiteSVM requires solana-sdk version matching anchor-lang's requirements
# For now, we use standard Rust tests which don't need these dependencies
# TODO: Add LiteSVM once solana-sdk versions align with Anchor 0.32.1

[dev-dependencies]
aya_poker = "0.1.0" # Reference implementation for hand evaluation testing
rand = "0.8"        # Random number generation for fuzz testing

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
